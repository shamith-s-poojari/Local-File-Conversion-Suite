[package]
name = "converter-router"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Adapter manifests, registry generation and the route planner (blueprint section 3)"

[dependencies]
converter-protocol = { path = "../protocol" }
# No default features: the HTTP resolver would give the core a network client.
jsonschema = { version = "0.61", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Maintained fork of serde_yaml. Manifests are repository files, not user input.
serde_norway = "0.9"
