[package]
name = "converter-jobstore"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Job store, job directories, staging, garbage collection and saving (spec section 10)"

[dependencies]
dirs = "7"
fs4 = { version = "0.13", features = ["sync"] }
getrandom = "0.3"
reflink-copy = "0.1"
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tempfile = "3"

[dev-dependencies]
tempfile = "3"
