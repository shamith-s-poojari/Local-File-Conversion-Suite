[package]
name = "converter-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Worker protocol types and codec, generated from packages/protocol/schema"

[dependencies]
# No default features: the HTTP resolver would give the core a network client.
jsonschema = { version = "0.61", default-features = false }
regress = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typify = "0.8"
zeroize = "1"
