# A stand-in for `pdf-redact` that app-core's lifecycle test runs in the real
# sandbox: it needs no engines, and misbehaves on demand (see adapter.py).
id: pdf-redact
kind: operation
title: Redact PDF
workerClass: pdf
inputs: { formats: [pdf], min: 1, max: 1 }
outputs: { format: pdf, cardinality: one }
fidelity: E
fidelityNotes: []
limits: { timeoutBaseS: 120, timeoutSPerMb: 3, noProgressS: 180, diskFactor: 4.0, processes: 1 }
params: ./params.schema.json
platforms: [windows, macos, linux]
requires: []
