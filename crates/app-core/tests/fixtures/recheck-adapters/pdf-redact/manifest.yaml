# A stand-in for `pdf-redact` that declares the output re-check, so the app
# runs the real `output-check` over what this one claims (see adapter.py).
id: pdf-redact
kind: operation
title: Redact PDF
workerClass: pdf
inputs: { formats: [pdf], min: 1, max: 1 }
outputs: { format: pdf, cardinality: one }
fidelity: E
fidelityNotes: []
recheck: redaction
limits: { timeoutBaseS: 120, timeoutSPerMb: 3, noProgressS: 180, diskFactor: 4.0, processes: 1 }
params: ./params.schema.json
platforms: [windows, macos, linux]
requires: []
