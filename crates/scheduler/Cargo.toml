[package]
name = "converter-scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Admission scheduler, worker supervisor and watchdog (spec sections 7.4 and 10.2 to 10.3)"

[dependencies]
converter-jobstore = { path = "../jobstore" }
converter-protocol = { path = "../protocol" }
converter-sniffer = { path = "../sniffer" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
