[package]
name = "converter-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Per-OS worker sandbox (spec section 9); Windows AppContainer launcher (T09)"

[[bin]]
name = "sandbox-launch"
path = "src/bin/sandbox-launch.rs"

[dependencies]
converter-scheduler = { path = "../scheduler" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
converter-jobstore = { path = "../jobstore" }
converter-protocol = { path = "../protocol" }
converter-sniffer = { path = "../sniffer" }
tempfile = "3"
