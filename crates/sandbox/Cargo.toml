[package]
name = "converter-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Per-job OS sandbox for workers, its runner and the self-test probe (spec section 9)"

[dependencies]
converter-scheduler = { path = "../scheduler" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
converter-jobstore = { path = "../jobstore" }
converter-sniffer = { path = "../sniffer" }
tempfile = "3"

[[bin]]
name = "converter-sandbox-run"
path = "src/bin/converter-sandbox-run.rs"
