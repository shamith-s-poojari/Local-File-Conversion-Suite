[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/jobstore",
    "crates/protocol",
    "crates/router",
    "crates/scheduler",
    "crates/sniffer",
]
exclude = ["crates/sniffer/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
