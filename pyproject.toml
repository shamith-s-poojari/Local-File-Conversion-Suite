[project]
name = "converter-workspace"
version = "0.1.0"
description = "Workspace root for the converter's Python workers and adapters"
requires-python = ">=3.12,<3.14"
license = "AGPL-3.0-only"
dependencies = []

[dependency-groups]
dev = [
    "converter-conformance",
    "converter-sdk",
    "datamodel-code-generator[ruff]==0.91.0",
    "pikepdf>=9.5,<10",
    "pillow>=11,<12",
    "pymupdf>=1.24,<2",
    "pypdfium2>=4.30,<5",
    "pytest>=8",
    "pyyaml>=6.0.3",
    "reportlab>=4.2,<5",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.uv.sources]
converter-conformance = { workspace = true }
converter-sdk = { workspace = true }

[tool.uv.workspace]
members = ["workers/sdk", "workers/conformance"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
# The conformance kit is test tooling: asserts and fixed test passwords are its job.
"workers/conformance/src/**" = ["S101", "S105"]
# Written by packages/protocol/scripts/generate.mjs; long schema descriptions stay on one line.
"**/protocol/_generated.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["workers", "adapters"]
# Every adapter has tests/test_adapter.py; importlib mode keeps them from colliding.
addopts = "--import-mode=importlib"
