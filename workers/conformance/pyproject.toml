[project]
name = "converter-conformance"
version = "0.1.0"
description = "Adapter conformance kit and test corpus (spec section 8.4)"
requires-python = ">=3.12,<3.14"
license = "AGPL-3.0-only"
dependencies = [
    "converter-sdk",
    "pikepdf>=9.5,<10",
    "pyyaml>=6.0.3",
]

[tool.uv.sources]
converter-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/converter_conformance"]
