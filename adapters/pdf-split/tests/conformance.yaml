cases:
  - name: ranges
    inputs: [text-10]
    params: { mode: ranges, ranges: "1-3, 5, 8-" }
    expect: { pages: [3, 1, 3] }
  - name: every-n
    inputs: [text-10]
    params: { mode: everyN, n: 4 }
    expect: { pages: [4, 4, 2] }
  - name: max-size
    inputs: [text-5]
    params: { mode: maxSize, maxSizeMb: 1 }
    expect: { pages: [5] }
negative:
  params: { mode: eachPage }
cancel:
  inputs: [big]
  params: { mode: eachPage }
