id: pdf-protect
kind: operation
title: Protect or unlock PDF
workerClass: pdf
inputs: { formats: [pdf], min: 1, max: 1 }
outputs: { format: pdf, cardinality: one }
fidelity: E
fidelityNotes: [SIGNATURE_INVALIDATED, XFA_UNSUPPORTED, ACTIVE_CONTENT_FOUND]
limits: { timeoutBaseS: 60, timeoutSPerMb: 1, noProgressS: 120, diskFactor: 2.0 }
params: ./params.schema.json
platforms: [windows, macos, linux]
requires: [pikepdf]
