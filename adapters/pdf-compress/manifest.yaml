id: pdf-compress
kind: operation
title: Compress PDF
workerClass: pdf
inputs: { formats: [pdf], min: 1, max: 1 }
outputs: { format: pdf, cardinality: one }
fidelity: L
fidelityNotes: [IMAGE_DOWNSCALED, KEPT_ORIGINAL, SIGNATURE_INVALIDATED, XFA_UNSUPPORTED, ACTIVE_CONTENT_FOUND]
limits: { timeoutBaseS: 60, timeoutSPerMb: 3, noProgressS: 180, diskFactor: 3.0 }
params: ./params.schema.json
platforms: [windows, macos, linux]
requires: [pikepdf, pillow]
