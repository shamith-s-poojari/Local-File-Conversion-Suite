id: images-to-gif
kind: operation
title: Make an animated GIF
workerClass: image
inputs: { formats: [png, jpg, webp, heic, gif, bmp, tiff, avif], min: 2, max: 300 }
outputs: { format: gif, cardinality: one }
fidelity: L
fidelityNotes: [COLORS_REDUCED, ANIMATION_FLATTENED]
limits: { timeoutBaseS: 60, timeoutSPerMb: 2, noProgressS: 120, diskFactor: 2.0 }
params: ./params.schema.json
platforms: [windows, macos, linux]
requires: [pillow, pillow-heif]
