name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  LFCS_DEV: "1" # the checkout's .venv is the runtime

# Action versions are pinned to commit SHAs; the release is in the comment.

jobs:
  fuzz-sniffer:
    name: Fuzz the sniffer (spec section 6)
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # 10 to 11 minutes so far: 10 of them fuzzing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz for 10 minutes
        working-directory: crates/sniffer
        run: cargo +nightly fuzz run sniff -- -max_total_time=600 -max_len=262144
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sniffer-fuzz-artifacts
          path: crates/sniffer/fuzz/artifacts/

  network-test:
    name: Network test with packet capture (spec 14.5), ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25 # 1 to 2 minutes when it passes, plus the build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y strace bubblewrap tcpdump ffmpeg libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          # Ubuntu 24.04 restricts unprivileged user namespaces, which stops bubblewrap.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        # Homebrew's ffmpeg 9 has no libvorbis (Ogg); ffmpeg-full does, and
        # is keg-only, so its bin goes on PATH.
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - run: uv sync --locked
      - name: Engine versions
        run: uv run --no-sync python tools/engine-versions.py --require ffmpeg
      - name: Capture and attribute traffic
        run: sudo -E env "PATH=$PATH" tools/network-test/capture.sh
